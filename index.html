    <style>
      :root {
        --bg: #1a1b26; --fg: #c0caf5; --cursor: #c0caf5; --prompt: #9ece6a;
        --red: #f7768e; --green: #9ece6a; --yellow: #e0af68;
        --blue: #7aa2f7; --magenta: #bb9af7; --cyan: #7dcfff; --selection: #33467c;
      }
      body { background: #1a1b26; }

      /* 以下两条必须内联在此，不能放进 global.css：
         它们管辖的静态简历标记由构建期插件直接注入本文件，
         必须在首帧就生效。放进外部样式表会让开发模式下先画出整份简历再藏起来。
         clip 裁剪而非 display:none —— 后者会被读屏软件跳过，等于没做无障碍。
         注意：<body> 末尾 <noscript> 里的 <style> 依靠源码顺序覆盖这里，禁用 JS 时还原可见。 */
      #static-resume {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        background: var(--bg);
        color: var(--fg);
        padding: 0.5rem 1rem;
        z-index: 10;
      }
      .skip-link:focus { left: 0; top: 0; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#static-resume">跳到无障碍简历版本</a>
    <div id="root"></div>
    <!--STATIC_RESUME-->
    <!--NOSCRIPT_RESUME-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
