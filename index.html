    <style>
      :root {
        --bg: #1a1b26; --fg: #c0caf5; --cursor: #c0caf5; --prompt: #9ece6a;
        --red: #f7768e; --green: #9ece6a; --yellow: #e0af68;
        --blue: #7aa2f7; --magenta: #bb9af7; --cyan: #7dcfff; --selection: #33467c;
      }
      body { background: #1a1b26; }

      /* The two rules below must stay inline here rather than move into global.css:
         the static resume markup they govern is injected into this very file by a
         build-time plugin and has to be styled on the first frame. From an external
         stylesheet, dev mode would paint the whole resume before hiding it.
         Clipping instead of display:none — the latter is skipped by screen readers,
         which would defeat the point of having an accessible copy at all.
         Note: the <style> inside <noscript> at the end of <body> overrides these by
         source order, restoring visibility when JS is disabled. */
      #static-resume {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        background: var(--bg);
        color: var(--fg);
        padding: 0.5rem 1rem;
        z-index: 10;
      }
      .skip-link:focus { left: 0; top: 0; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#static-resume">Skip to accessible résumé</a>
    <div id="root"></div>
    <!--STATIC_RESUME-->
    <!--NOSCRIPT_RESUME-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
